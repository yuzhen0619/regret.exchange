<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>遺憾交易所</title>
<script>
  (function(d) {
    var config = {
      kitId: 'fvo4maz',
      scriptTimeout: 3000,
      async: true
    },
    h=d.documentElement,t=setTimeout(function(){h.className=h.className.replace(/\bwf-loading\b/g,"")+" wf-inactive";},config.scriptTimeout),tk=d.createElement("script"),f=false,s=d.getElementsByTagName("script")[0],a;h.className+=" wf-loading";tk.src='https://use.typekit.net/'+config.kitId+'.js';tk.async=true;tk.onload=tk.onreadystatechange=function(){a=this.readyState;if(f||a&&a!="complete"&&a!="loaded")return;f=true;clearTimeout(t);try{Typekit.load(config)}catch(e){}};s.parentNode.insertBefore(tk,s)
  })(document);

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #f4e9d9;
    font-family: 'ar-yuanb5std', 'Noto Serif TC', Georgia, serif;
    color: #b69a88;
  }

  .image-section img {
    display: block;
    width: 100%;
    max-width: 800px;
    margin: 0 auto;
  }

  .video-section {
    background: #f4e9d9;
    padding: 24px 0 56px;
  }

  .video-section__inner {
    max-width: 800px;
    margin: 0 auto;
    padding: 0 5%;
  }

  .video-section__heading {
    margin-bottom: 24px;
    border-top: 1px solid #c8b09a;
    padding-top: 10px;
    padding-left: 4px;
  }

  .video-section__heading h2 {
    font-size: clamp(16px, 6vw, 22px);
    color: #b69a88;
    letter-spacing: 0.06em;
    font-weight: 500;
    line-height: 1.4;
    font-family: 'ar-yuanb5std', sans-serif;
  }

  /* 中文部分：圓體 */
  .video-section__heading h2 .zh {
    font-family: 'ar-yuanb5std', 'Noto Serif TC', Georgia, serif;
  }

  /* 英文部分：同圓體 */
  .video-section__heading h2 .en {
    font-family: 'ar-yuanb5std', 'Noto Serif TC', Georgia, serif;
    font-size: 17px;
    font-weight: 500;
    letter-spacing: 0.06em;
  }

  .video-grid {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  @media (min-width: 680px) {
    .video-grid {
      flex-direction: row;
      align-items: flex-start;
      gap: 16px;
    }
    .video-card.portrait  { flex: 0 0 37%; }
    .video-card.landscape { flex: 1; }
  }

  .video-card {
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid #d4bfae;
    background: #f4e9d9;
  }

  .video-card.portrait .video-card__embed {
    padding-top: 177.78%;
  }

  .video-card__embed {
    position: relative;
    width: 100%;
    padding-top: 56.25%;
    background: #2a1e14;
  }

  .video-card__embed video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .video-card__info {
    padding: 10px 12px 12px;
  }

  .video-card__info h3 {
    font-family: 'ar-yuanb5std', 'Noto Serif TC', Georgia, serif;
    font-size: 13px;
    color: #b69a88;
    font-weight: 500;
    letter-spacing: 0.08em;
    margin-bottom: 3px;
  }

  .video-card__info p {
    font-family: 'ar-yuanb5std', 'Noto Serif TC', Georgia, serif;
    font-size: 11.5px;
    color: #c9ad9b;
    line-height: 1.7;
    letter-spacing: 0.03em;
  }
</style>
</head>
<body>

<div class="image-section">
  <img src="./p4.jpg" alt="遺憾交易所">
</div>

<section class="video-section">
  <div class="video-section__inner">

    <div class="video-section__heading">
      <h2><span class="zh">桌遊影片</span><span class="en">｜Game Trailer &amp; Playthroughs</span></h2>
    </div>

    <div class="video-grid">

      <div class="video-card portrait">
        <div class="video-card__embed">
          <video controls playsinline>
            <source src="./video1.mp4" type="video/mp4">
          </video>
        </div>
        <div class="video-card__info">
          <h3>試玩影片</h3>
          <p>桌遊試玩 ── 劇情1：終點站前的死亡列車。</p>
        </div>
      </div>

    </div>
  </div>
</section>

</body>
</html>
